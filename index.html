<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Spin Amplop THR</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#0f172a,#020617);
color:white;
flex-direction:column;
}

h1{
margin-bottom:25px;
font-size:28px;
text-shadow:0 0 10px gold;
}

#wheel{
width:340px;
height:340px;
border-radius:50%;
border:10px solid white;
position:relative;
overflow:hidden;
transition:transform 4s cubic-bezier(.17,.67,.3,1);
box-shadow:0 0 30px rgba(255,255,255,0.4);
}

.segment{
position:absolute;
width:50%;
height:50%;
transform-origin:100% 100%;
display:flex;
justify-content:flex-end;
align-items:flex-end;
padding:12px;
font-weight:bold;
color:white;
}

.segment span{
transform:rotate(22deg);
font-size:16px;
}

.pointer{
position:absolute;
top:calc(50% - 210px);
width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-bottom:28px solid white;
}

button{
margin-top:30px;
padding:14px 40px;
font-size:20px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
cursor:pointer;
box-shadow:0 0 15px #22c55e;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

</style>
</head>

<body>

<h1>🎁 Spin Amplop THR</h1>

<div class="pointer"></div>

<div id="wheel"></div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>

const prizes=[
"100rb",
"50rb",
"20rb",
"10rb",
"5rb",
"Zonk",
"20rb",
"10rb"
]

const allowed=[
"20rb",
"10rb",
"5rb",
"Zonk"
]

const wheel=document.getElementById("wheel")

prizes.forEach((p,i)=>{

const seg=document.createElement("div")
seg.className="segment"

seg.style.transform=`rotate(${i*45}deg) skewY(-45deg)`
seg.style.background=i%2?"#f97316":"#ef4444"

const text=document.createElement("span")
text.innerText=p

seg.appendChild(text)

wheel.appendChild(seg)

})

let deg=0

function spin(){

const result=allowed[Math.floor(Math.random()*allowed.length)]

const index=prizes.indexOf(result)

const rotateTo=(360*6)+(index*45)

deg+=rotateTo

wheel.style.transform=`rotate(${deg}deg)`

setTimeout(()=>{
document.getElementById("result").innerText="Kamu dapat: "+result
},4000)

}

</script>

</body>
</html>
