<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Amplop THR</title>

<style>
:root{
  --size: 86vw;
  --max: 380px;
  --red: #ff2d2d;
  --orange: #ff9f00;
  --border: #111;
  --accent: #22c55e;
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#111;
}

h1{
  margin:8px 0 18px;
  font-weight:800;
  letter-spacing:.5px;
}

.container{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== Wheel ===== */
#wheel{
  width:var(--size);
  height:var(--size);
  max-width:var(--max);
  max-height:var(--max);
  border-radius:50%;
  border:10px solid var(--border);
  background:
  conic-gradient(
    var(--orange) 0deg 45deg,
    var(--red)    45deg 90deg,
    var(--orange) 90deg 135deg,
    var(--red)    135deg 180deg,
    var(--orange) 180deg 225deg,
    var(--red)    225deg 270deg,
    var(--orange) 270deg 315deg,
    var(--red)    315deg 360deg
  );
  position:relative;
  transform-style:preserve-3d;
  transition:transform 4s cubic-bezier(.17,.67,.3,1);
  box-shadow:
    0 20px 40px rgba(0,0,0,.15),
    inset 0 0 25px rgba(0,0,0,.25);
  overflow:hidden;
}

/* labels */
.label{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:center;
  color:#fff;
  font-weight:800;
  font-size:18px;
  text-shadow:0 2px 2px rgba(0,0,0,.35);
  user-select:none;
}
.l1{transform:rotate(0deg) translate(0,-38%) rotate(0deg);}
.l2{transform:rotate(45deg) translate(0,-38%) rotate(-45deg);}
.l3{transform:rotate(90deg) translate(0,-38%) rotate(-90deg);}
.l4{transform:rotate(135deg) translate(0,-38%) rotate(-135deg);}
.l5{transform:rotate(180deg) translate(0,-38%) rotate(-180deg);}
.l6{transform:rotate(225deg) translate(0,-38%) rotate(-225deg);}
.l7{transform:rotate(270deg) translate(0,-38%) rotate(-270deg);}
.l8{transform:rotate(315deg) translate(0,-38%) rotate(-315deg);}

/* ===== Pointer (panah ke bawah) ===== */
.pointer{
  position:absolute;
  top:-34px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-bottom:42px solid #000; /* panah mengarah ke bawah */
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
  z-index:10;
}

/* ===== Button ===== */
button{
  margin-top:22px;
  padding:14px 44px;
  font-size:20px;
  font-weight:700;
  color:#fff;
  background:var(--accent);
  border:none;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
  transition:transform .08s ease, box-shadow .15s ease;
}
button:active{
  transform:translateY(2px) scale(.98);
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

#result{
  margin-top:16px;
  font-size:26px;
  font-weight:800;
}

/* ===== Effects ===== */
.confetti{
  position:fixed;
  width:8px;height:8px;
  top:-12px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

.money{
  position:fixed;
  font-size:26px;
  top:-20px;
  animation:moneyFall 3s linear forwards;
}
@keyframes moneyFall{
  0%{transform:translateY(0)}
  100%{transform:translateY(100vh);opacity:0}
}

/* subtle glow while spinning */
.spinning{
  box-shadow:
    0 25px 60px rgba(0,0,0,.18),
    inset 0 0 35px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<h1>🎁 Spin Amplop THR</h1>

<div class="container">
  <div class="pointer"></div>

  <div id="wheel">
    <div class="label l1">100rb</div>
    <div class="label l2">50rb</div>
    <div class="label l3">20rb</div>
    <div class="label l4">10rb</div>
    <div class="label l5">5rb</div>
    <div class="label l6">Zonk</div>
    <div class="label l7">20rb</div>
    <div class="label l8">10rb</div>
  </div>

  <button id="spinBtn">SPIN</button>
  <div id="result"></div>
</div>

<audio id="tick">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c6c3a8d2c.mp3">
</audio>

<script>
const prizes=["100rb","50rb","20rb","10rb","5rb","Zonk","20rb","10rb"];
const allowed=["20rb","10rb","5rb","Zonk"];

let rotation=0;
const wheel=document.getElementById("wheel");
const resultEl=document.getElementById("result");
const tick=document.getElementById("tick");

document.getElementById("spinBtn").onclick=spin;

function spin(){
  wheel.classList.add("spinning");

  const slice=360/prizes.length;
  const result=allowed[Math.floor(Math.random()*allowed.length)];
  let index=prizes.indexOf(result);

  /* efek hampir dapat 100rb */
  const nearJackpot=Math.random()<0.55;
  if(nearJackpot){ index=0; }

  rotation+=(360*6)+(index*slice)+(slice/2);
  wheel.style.transform="rotate("+rotation+"deg)";

  /* suara klik saat lewat slice */
  let t=setInterval(()=>{
    try{ tick.currentTime=0; tick.play(); }catch(e){}
  },120);

  setTimeout(()=>clearInterval(t),3900);

  setTimeout(()=>{
    if(nearJackpot){
      rotation+=22;
      wheel.style.transform="rotate("+rotation+"deg)";
    }

    resultEl.innerText="Kamu dapat: "+result;

    if(result!=="Zonk"){
      confetti();
      moneyRain();
    }

    wheel.classList.remove("spinning");
  },4000);
}

function confetti(){
  for(let i=0;i<50;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background="hsl("+Math.random()*360+",100%,50%)";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

function moneyRain(){
  for(let i=0;i<24;i++){
    const m=document.createElement("div");
    m.className="money";
    m.innerHTML="💸";
    m.style.left=Math.random()*100+"vw";
    document.body.appendChild(m);
    setTimeout(()=>m.remove(),3000);
  }
}
</script>

</body>
</html>
