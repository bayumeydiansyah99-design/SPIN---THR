<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin THR Lebaran</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="bg-masjid">

<div class="header">
<h1>🌙 Spin THR Lebaran</h1>
<p>Geser roda untuk memutar</p>
</div>

<div class="wheel-container">

<div class="pointer"></div>

<canvas id="wheel" width="320" height="320"></canvas>

<p class="swipe-text">Geser roda</p>

</div>

<div class="result-box">
<h2 id="result">Semoga Beruntung 🎉</h2>
</div>

<audio id="tick">
<source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3">
</audio>

<audio id="takbir">
<source src="https://archive.org/download/takbir-idul-fitri/takbir.mp3">
</audio>

<div id="popup" class="popup">
<div class="popup-content">
<h2 id="popupText">🎉 Kamu dapat THR</h2>
<button onclick="closePopup()">Tutup</button>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
