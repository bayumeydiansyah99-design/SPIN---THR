<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin Amplop THR</title>

<style>

body{
margin:0;
font-family:Arial;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
}

h1{
margin-bottom:20px;
}

.container{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
}

#wheel{

width:85vw;
height:85vw;

max-width:380px;
max-height:380px;

border-radius:50%;

background:
conic-gradient(
#ff9f00 0deg 45deg,
#ff2d2d 45deg 90deg,
#ff9f00 90deg 135deg,
#ff2d2d 135deg 180deg,
#ff9f00 180deg 225deg,
#ff2d2d 225deg 270deg,
#ff9f00 270deg 315deg,
#ff2d2d 315deg 360deg
);

border:10px solid black;

position:relative;

transition:transform 4s cubic-bezier(.17,.67,.3,1);

box-shadow:
0 20px 40px rgba(0,0,0,0.2),
inset 0 0 25px rgba(0,0,0,0.3);

}

/* pointer panah ke bawah */

.pointer{

position:absolute;

top:-35px;
left:50%;

transform:translateX(-50%);

width:0;
height:0;

border-left:25px solid transparent;
border-right:25px solid transparent;

border-bottom:45px solid black;

z-index:10;

}

/* label hadiah */

.label{

position:absolute;

left:50%;
top:50%;

color:white;

font-weight:bold;

font-size:18px;

transform-origin:center;

}

/* posisi label */

.l1{transform:rotate(0deg) translate(0,-140px) rotate(0deg);}
.l2{transform:rotate(45deg) translate(0,-140px) rotate(-45deg);}
.l3{transform:rotate(90deg) translate(0,-140px) rotate(-90deg);}
.l4{transform:rotate(135deg) translate(0,-140px) rotate(-135deg);}
.l5{transform:rotate(180deg) translate(0,-140px) rotate(-180deg);}
.l6{transform:rotate(225deg) translate(0,-140px) rotate(-225deg);}
.l7{transform:rotate(270deg) translate(0,-140px) rotate(-270deg);}
.l8{transform:rotate(315deg) translate(0,-140px) rotate(-315deg);}

/* tombol */

button{

margin-top:25px;

padding:15px 45px;

font-size:20px;

background:#22c55e;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

/* hasil */

#result{

margin-top:20px;

font-size:24px;

font-weight:bold;

}

/* confetti */

.confetti{

position:fixed;

width:8px;
height:8px;

top:-10px;

animation:fall 3s linear forwards;

}

@keyframes fall{

0%{transform:translateY(0)}
100%{transform:translateY(100vh);opacity:0}

}

/* uang jatuh */

.money{

position:fixed;

font-size:28px;

top:-20px;

animation:moneyFall 3s linear forwards;

}

@keyframes moneyFall{

0%{transform:translateY(0)}
100%{transform:translateY(100vh);opacity:0}

}

.extra1{}
.extra2{}
.extra3{}
.extra4{}
.extra5{}
.extra6{}
.extra7{}
.extra8{}
.extra9{}
.extra10{}
.extra11{}
.extra12{}
.extra13{}
.extra14{}
.extra15{}
.extra16{}
.extra17{}
.extra18{}
.extra19{}
.extra20{}
.extra21{}
.extra22{}
.extra23{}
.extra24{}
.extra25{}
.extra26{}
.extra27{}
.extra28{}
.extra29{}
.extra30{}

</style>

</head>

<body>

<h1>🎁 Spin Amplop THR</h1>

<div class="container">

<div class="pointer"></div>

<div id="wheel">

<div class="label l1">100rb</div>
<div class="label l2">50rb</div>
<div class="label l3">20rb</div>
<div class="label l4">10rb</div>
<div class="label l5">5rb</div>
<div class="label l6">Zonk</div>
<div class="label l7">20rb</div>
<div class="label l8">10rb</div>

</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

</div>

<audio id="tick">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c6c3a8d2c.mp3">
</audio>

<script>

const prizes=[
"100rb",
"50rb",
"20rb",
"10rb",
"5rb",
"Zonk",
"20rb",
"10rb"
]

const allowed=[
"20rb",
"10rb",
"5rb",
"Zonk"
]

let rotation=0

function spin(){

const wheel=document.getElementById("wheel")

const result=allowed[Math.floor(Math.random()*allowed.length)]

let index=prizes.indexOf(result)

const slice=360/prizes.length

let nearJackpot=Math.random()<0.5

if(nearJackpot){
index=0
}

rotation += (360*5)+(index*slice)+(slice/2)

wheel.style.transform="rotate("+rotation+"deg)"

const tick=document.getElementById("tick")

let t=setInterval(()=>{
tick.currentTime=0
tick.play()
},120)

setTimeout(()=>clearInterval(t),3900)

setTimeout(()=>{

if(nearJackpot){

rotation+=22

wheel.style.transform="rotate("+rotation+"deg)"

}

document.getElementById("result").innerText="Kamu dapat: "+result

if(result!=="Zonk"){

confetti()

moneyRain()

}

},4000)

}

function confetti(){

for(let i=0;i<40;i++){

let c=document.createElement("div")

c.className="confetti"

c.style.left=Math.random()*100+"vw"

c.style.background="hsl("+Math.random()*360+",100%,50%)"

document.body.appendChild(c)

setTimeout(()=>c.remove(),3000)

}

}

function moneyRain(){

for(let i=0;i<20;i++){

let m=document.createElement("div")

m.className="money"

m.innerHTML="💸"

m.style.left=Math.random()*100+"vw"

document.body.appendChild(m)

setTimeout(()=>m.remove(),3000)

}

}

</script>

</body>
</html>
